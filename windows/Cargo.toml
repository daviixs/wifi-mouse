[package]
name = "remote-mouse-windows"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Remote Mouse — servidor nativo para Windows na área de notificação"
build = "build.rs"

[[bin]]
name = "RemoteMouse"
path = "src/main.rs"

# Only Windows builds link the agent (enigo needs a backend feature on Linux).
# On other hosts `cargo test` still runs the platform-independent UI logic.
[target.'cfg(windows)'.dependencies]
remote-mouse-agent = { path = "../rust-agent" }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
