[package]
name = "remote-mouse-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["platform_specific"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hostname = "0.4.2"
if-addrs = "0.15.0"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
